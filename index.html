<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0b" />
<title>ToolCrate — Real Tools. Sealed Crates.</title>

<!-- ============================================================
     LINK PREVIEW
     This is what iMessage, Instagram, Facebook, Slack and TikTok
     read when the link is pasted. Without it they show a bare link
     icon and the domain, which is what was happening before.

     Update toolcrateapp.com below if the domain ever changes — the
     image URL has to be absolute, relative paths are ignored here.

     Once Official Rules are published, the giveaway line commented
     out under og:description converts far harder. Do not switch it
     on before the rules exist.
     ============================================================ -->
<meta name="description" content="Every crate ships a real tool, with the odds published up front. Join the list for the first drop." />
<link rel="canonical" href="https://toolcrateapp.com/" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="ToolCrate" />
<meta property="og:url" content="https://toolcrateapp.com/" />
<meta property="og:title" content="ToolCrate — Real Tools. Sealed Crates." />
<meta property="og:description" content="Every crate ships a real tool, with the odds published up front. Join the list for the first drop." />
<!-- <meta property="og:description" content="20 free crates at the first drop. No purchase necessary, 18+. Every crate ships a real tool." /> -->
<meta property="og:image" content="https://toolcrateapp.com/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="ToolCrate — every crate ships a real tool" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="ToolCrate — Real Tools. Sealed Crates." />
<meta name="twitter:description" content="Every crate ships a real tool, with the odds published up front. Join the list for the first drop." />
<meta name="twitter:image" content="https://toolcrateapp.com/og.png" />

<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="ToolCrate" />

<!-- Search engines are allowed in. Swap to "noindex, nofollow" to pull
     the site back out of results without taking it offline. -->
<meta name="robots" content="index, follow" />

<link rel="preconnect" href="https://unpkg.com" crossorigin />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0b;
    color: #f5f5f4;
    font-family: Barlow, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #root { min-height: 100vh; min-height: 100dvh; }

  /* shown until React mounts, then replaced */
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  #boot .mark {
    font-family: "Big Shoulders Display", Barlow, sans-serif;
    font-weight: 800; letter-spacing: .18em;
    font-size: 30px; text-transform: uppercase;
    color: #fafaf9;
  }
  #boot .bar {
    width: 190px; height: 3px; border-radius: 2px;
    background: #27272a; overflow: hidden;
  }
  #boot .bar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, transparent, #eab308, transparent);
    animation: sweep 1.05s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(360%); }
  }
  #boot .sub { font-size: 12px; letter-spacing: .1em; color: #71717a; text-transform: uppercase; }

  #fail {
    display: none; max-width: 620px; margin: 40px auto; padding: 20px 24px;
    border: 1px solid #7f1d1d; border-radius: 10px; background: #1c0f0f;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #fecaca;
  }
  #fail b { color: #fca5a5; display: block; margin-bottom: 8px; font-size: 13px; }
</style>
</head>
<body>

<div id="root"></div>

<div id="boot">
  <div class="mark">ToolCrate</div>
  <div class="bar"><i></i></div>
  <div class="sub">Loading prototype</div>
</div>

<pre id="fail"></pre>

<script>
  // Surface errors on screen instead of a blank page.
  (function () {
    function show(msg) {
      var boot = document.getElementById('boot');
      if (boot) boot.style.display = 'none';
      var el = document.getElementById('fail');
      el.style.display = 'block';
      el.innerHTML = '<b>ToolCrate failed to start</b>';
      el.appendChild(document.createTextNode(msg));
    }
    window.addEventListener('error', function (e) {
      show((e.message || 'Unknown error') +
           (e.filename ? '\n\nat ' + e.filename + ':' + (e.lineno || '?') : '') +
           '\n\nIf you opened this file directly from your hard drive, that is the cause — ' +
           'the browser blocks loading app.jsx over file://. Use the GitHub Pages URL, ' +
           'or run a local server (see README).');
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Failed to load a resource: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  })();
</script>

<!-- React 18 + in-browser JSX transpile. No build step, no bundler. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>

<script>
  // Clear the boot screen once React has painted something.
  (function () {
    var tries = 0;
    var t = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.childElementCount > 0) {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        clearInterval(t);
      } else if (++tries > 200) {   // ~20s
        clearInterval(t);
      }
    }, 100);
  })();
</script>

</body>
</html>
